name: ci

# Build RustCloak and run the differential correctness gate on every push/PR. The LLVM 18 job is
# required; 19/20 are best-effort early-warning for the next LLVM major (a red 19/20 here means the
# plugin needs porting -- deprecated/removed LLVM C++ APIs -- before Rust bundles that LLVM).
on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        llvm: ["18"]
        include:
          - { llvm: "19", optional: true }
          - { llvm: "20", optional: true }
    continue-on-error: ${{ matrix.optional == true }}
    name: llvm-${{ matrix.llvm }}
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM ${{ matrix.llvm }} + build tools
        run: |
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh ${{ matrix.llvm }}
          sudo apt-get install -y llvm-${{ matrix.llvm }}-dev clang-${{ matrix.llvm }} \
                                  cmake ninja-build

      - name: Build plugin
        run: |
          cmake -S . -B build -G Ninja -DLLVM_DIR="$(llvm-config-${{ matrix.llvm }} --cmakedir)"
          cmake --build build

      - name: Differential correctness gate
        env:
          CLANG: clang-${{ matrix.llvm }}
          CLANGXX: clang++-${{ matrix.llvm }}
          OPT: opt-${{ matrix.llvm }}
          LLVM_CONFIG: llvm-config-${{ matrix.llvm }}
        run: bash test/difftest.sh

      - name: Metamorphism invariant
        env: { CLANG: clang-${{ matrix.llvm }}, LLVM_CONFIG: llvm-config-${{ matrix.llvm }} }
        run: bash test/diversity.sh
